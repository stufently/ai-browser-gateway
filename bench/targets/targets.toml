# Боевые цели фазы 1. Согласованы владельцем 06.09.2026.
#
# ПРАВИЛО НАГРУЗКИ: один запрос на пару (провайдер × цель) за прогон, между
# запросами к одному хосту пауза не меньше 30 с. Параллельного долбления нет.
# Цель проекта — доставать нужные страницы, а не создавать нагрузку.
#
# `expect` — подстрока, которая обязана быть в извлечённом контенте, СРАВНЕНИЕ
# РЕГИСТРОЗАВИСИМОЕ. HTTP 200 успехом не считается: страница-заглушка Cloudflare
# тоже приходит с 200.
#
# 🚨 `expect` не должен встречаться на странице-заглушке. Грабля оплачена
# 06.09.2026: для bizprofile.net стояло `expect` со словом "bizprofile", а заглушка CF
# называет заблокированный хост — и провальный запрос засчитывался успехом.
# Поэтому все `expect` ниже взяты из <title> или уникального текста РЕАЛЬНОЙ
# страницы и проверены на теле заглушки.

[[target]]
id = "control-hqd"
url = "https://hqdphuket.com/"
class = "none"
owner = "self"
note = "Свой OpenCart за обычным nginx. Контроль: тут обязаны пройти ВСЕ провайдеры. Провайдер, который не берёт эту цель, сломан, а не 'заблокирован'."
expect = "HQD"

[[target]]
id = "control-static"
url = "https://example.com/"
class = "none"
owner = "third-party"
note = "Минимальная статика. Нижняя граница накладных расходов провайдера."
expect = "Example Domain"

[[target]]
id = "cf-lowendtalk"
url = "https://lowendtalk.com/categories/offers"
class = "cloudflare"
owner = "third-party"
note = "Старый бой владельца. Замерено 06.09.2026: голый curl → 403. Категория, а не тред: по web-monitoring.md треды закрыты жёстче."
expect = "Offers — LowEndTalk"

[target.entrances]
rss = "https://lowendtalk.com/categories/offers/feed.rss"

[[target]]
id = "cf-bizprofile"
url = "https://bizprofile.net/"
class = "cloudflare"
owner = "third-party"
note = "Снят с мониторинга check-sites из-за CF-челленджа и 403; возврат намечен на 12.09.2026. Замерено 06.09.2026: голый curl → 403. Результат применим в тот же день."
expect = "Comprehensive Directory of Registered Businesses"

[[target]]
id = "cf-spa-chatgpt-share"
url = "https://chatgpt.com/share/6a9d9e26-4e08-83ed-b615-b57feb9d7043"
class = "cloudflare+spa"
owner = "third-party"
note = "Публичная share-страница, которую владелец сам и прислал. Двойная сложность: CF плюс контент, которого в первичном HTML нет — он в turbo-stream payload. Отличает 'провайдер прошёл CF' от 'провайдер достал контент'."
expect = "Начать AI Browser Gateway"

[[target]]
id = "login-instagram"
url = "https://www.instagram.com/reel/DdJ-MY6OITt/"
class = "login-wall"
owner = "third-party"
note = "Живой рилс, замерен 14.09.2026 с этого хоста: curl -sL → HTTP 200, 675468 байт, <title>Instagram</title>, подстрока «Кирилл Жильников» в теле 0 вхождений; headless Chromium со stealth → 200, 1138260 байт, og:title = «Кирилл Жильников on Instagram: …», подстрока «Кирилл Жильников» — 3 вхождения. Строка ожидания на странице-заглушке не встречается. Меряется доступ к подписи и мета-разметке, не к самому видео: видео остаётся за стеной логина."
expect = "Кирилл Жильников on Instagram"

