name = "AI Browser Gateway"
title = "AI Browser Gateway — fetch web pages for AI agents"
headline = "Fetch web pages for AI agents: HTTP first, a headless browser when needed"
description = "One-shot Docker image, MCP server and self-hosted API: a provider ladder of curl_cffi, Patchright and Scrapling for JavaScript pages and Cloudflare challenges."
lang = "en"
keywords = ["web fetching", "ai agents", "headless browser", "mcp server", "cloudflare", "web scraping", "playwright", "browser automation"]
